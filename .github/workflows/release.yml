# Build + publish workflow for the custom-fork `custom` branch.
#
# Builds a reproducible APK/AAB from the selected branch (MollyIM + private
# patches) using the project's Docker build, signs APKs with uber-apk-signer's
# built-in public (debug) key, and uploads the artifact + a GitHub release.
#
# It can be triggered:
#   - manually (workflow_dispatch)  -> builds the selected ref (default `custom`)
#   - by the sync workflow (workflow_call) after a successful rebase
#
# Required repository CONFIGURATION (Settings > Secrets and variables > Actions):
#   Variables (repo vars) - optional; override release naming. If unset, the
#     build falls back to values from ci/<BUILD_ENV_FILE>.env:
#       CI_APP_TITLE, CI_APP_FILENAME, CI_PACKAGE_ID, CI_BUILD_VARIANTS,
#       CI_FORCE_INTERNAL_USER_FLAG
#   No secrets are required: APKs are signed with uber-apk-signer's embedded
#   public debug key (alias androiddebugkey), so anyone can reproduce the same
#   signature. AABs are not signed by this workflow.

name: Build and release custom

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to build (default: custom)'
        required: false
        default: 'custom'
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: 'custom'
      version:
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  REF: "${{ inputs.ref || 'custom' }}"
  BUILD_ENV_FILE: ${{ vars.BUILD_ENV_FILE || 'beta-stable.env' }}

jobs:
  build:
    name: Build and publish custom
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: "${{ env.REF }}"
          persist-credentials: false

      - name: Free up disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Tag HEAD for CI versionName
        # The app build runs with -PCI=true, which requires
        # `git describe --tags --exact-match` to succeed. This fork builds the
        # `custom` branch directly (no MollyIM-style tag push), so we stamp a
        # local tag on the checked-out HEAD BEFORE `docker compose build` so the
        # Docker `COPY . /molly/` carries it into the container's git. The tag is
        # local-only and never pushed.
        run: |
          TAG="v${{ env.RELEASE_TAG || github.sha }}"
          git tag -f "$TAG"
          echo "Stamped local tag: $TAG"
          git describe --tags --exact-match

      - name: Build Docker image
        run: docker compose build
        working-directory: reproducible-builds

      - name: Export CI environment variables
        run: |
          cp -v "ci/$BUILD_ENV_FILE" .env
          for var in APP_TITLE APP_FILENAME PACKAGE_ID \
                     BUILD_VARIANTS FORCE_INTERNAL_USER_FLAG; do
            if [ -n "${!var}" ]; then
              echo "Setting CI_$var=${!var}"
              echo "CI_$var=${!var}" >> $GITHUB_ENV
            fi
          done
        working-directory: reproducible-builds
        env:
          APP_TITLE: ${{ vars.CI_APP_TITLE }}
          APP_FILENAME: ${{ vars.CI_APP_FILENAME }}
          PACKAGE_ID: ${{ vars.CI_PACKAGE_ID }}
          BUILD_VARIANTS: ${{ vars.CI_BUILD_VARIANTS }}
          FORCE_INTERNAL_USER_FLAG: ${{ vars.CI_FORCE_INTERNAL_USER_FLAG }}

      - name: Build unsigned APK/AAB (Docker)
        run: docker compose run -v "$GRADLE_USER_HOME/caches:/.gradle-ro-cache:ro" assemble
        working-directory: reproducible-builds

      - name: Download uber-apk-signer
        working-directory: reproducible-builds
        run: |
          curl -fsSL -o uber-apk-signer.jar \
            "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          java -jar uber-apk-signer.jar --version

      - name: Sign APKs with public (debug) key
        # Signs every produced APK with uber-apk-signer's built-in debug keystore
        # (the well-known public key: alias androiddebugkey, password android). No
        # private keystore or secrets are needed. Signed files are written to
        # signed_apks/ (uber names them like <name>-aligned-debugSigned.apk).
        working-directory: reproducible-builds
        run: |
          APKS=$(find outputs/apk -name '*.apk' -type f)
          [ -n "$APKS" ] || { echo "no APKs found to sign"; exit 1; }
          # shellcheck disable=SC2086
          java -jar ./uber-apk-signer.jar --apks $APKS --out signed_apks --verbose
          echo "Signed APKs:"
          find signed_apks -name '*.apk' -type f

      - name: Log APK and AAB checksums
        run: find outputs signed_apks \( -name "*.aab" -o -name "*.apk" \) -exec sha256sum '{}' +
        working-directory: reproducible-builds

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            reproducible-builds/signed_apks/*.apk
            reproducible-builds/outputs/apk/*/release/*.apk
          if-no-files-found: error

      - name: Upload Bundles (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: reproducible-builds/outputs/bundle/*Release/*.aab
          if-no-files-found: warn

      - name: Compute release metadata
        id: metadata
        run: |
          # Resolve a version label from the provided input or the source.
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git describe --tags --always 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=custom" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        run: |
          TAG="${{ steps.metadata.outputs.tag }}"
          VER="${{ steps.metadata.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes || true
          # Create the release first, then attach the APK/AAB assets by glob.
          gh release create "$TAG" \
            --title "Custom build — $VER" \
            --notes "Automated custom-fork build of \`${{ env.REF }}\` (MollyIM + private patches). APKs signed with the public debug key via uber-apk-signer; AAB is unsigned."
          gh release upload "$TAG" reproducible-builds/signed_apks/*.apk --clobber \
            || echo "warning: no signed APK matched the upload glob"
          gh release upload "$TAG" reproducible-builds/outputs/bundle/*Release/*.aab --clobber \
            || echo "warning: no AAB matched the upload glob"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish app version output
        id: version
        run: echo "version=${{ steps.metadata.outputs.version }}" >> "$GITHUB_OUTPUT"
